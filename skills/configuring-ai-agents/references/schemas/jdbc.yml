Jdbc:
  type: object
  description: |-
    Configuration for JDBC import operations. Defines how data is written to a database
    via a JDBC connection.

    **Query type determines which fields are required**

    | queryType        | Required fields              | Do NOT set        |
    |------------------|------------------------------|-------------------|
    | ["per_record"]   | query (array of SQL strings) | bulkInsert        |
    | ["per_page"]     | query (array of SQL strings) | bulkInsert        |
    | ["bulk_insert"]  | bulkInsert object            | query             |
    | ["bulk_load"]    | bulkLoad object; query too when bulkLoad.overrideMergeOrInsertQuery is true | query otherwise |

    **Critical:** query IS AN ARRAY OF STRINGS
    The query field must be an array of plain strings, NOT a single string and NOT an array of objects.
    Correct: ["INSERT INTO users (name) VALUES ('{{{name}}}')"]
    Wrong: "INSERT INTO users ..."
    Wrong: [{"query": "INSERT INTO users ..."}]
  required:
    - queryType
  properties:
    query:
      type: array
      items:
        type: string
      x-celigo-agent:
        - sql
      description: |-
        Array of SQL query strings to execute. REQUIRED when queryType is ["per_record"] or ["per_page"],
        and on a ["bulk_load"] import whose bulkLoad.overrideMergeOrInsertQuery is true, where its one
        statement replaces the generated MERGE / INSERT.

        Each element is a complete SQL statement as a plain string. Typically contains a single query.

        Use Handlebars {{fieldName}} syntax to inject values from incoming records.

        **Format — array of strings**
        - CORRECT: ["INSERT INTO users (name, email) VALUES ('{{{name}}}', '{{{email}}}')"]
        - WRONG: "INSERT INTO users ..."  (not an array)
        - WRONG: [{"query": "INSERT INTO users ..."}]  (objects are invalid — causes Cast error)

        **Examples**
        - INSERT: ["INSERT INTO users (name, email) VALUES ('{{{name}}}', '{{{email}}}')"]
        - UPDATE: ["UPDATE inventory SET qty = {{{quantity}}} WHERE sku = '{{{sku}}}'"]
        - MERGE/UPSERT: ["MERGE INTO target USING (SELECT CAST(? AS VARCHAR) AS email) AS src ON target.email = src.email WHEN MATCHED THEN UPDATE SET name = ? WHEN NOT MATCHED THEN INSERT (name, email) VALUES (?, ?)"]

        **String vs numeric values in handlebars**
        - Use triple braces so the raw value is emitted; double braces emit the value already single-quoted, so wrapping them in quotes double-quotes it.
        - Strings: supply the quotes yourself — '{{{name}}}'
        - Numbers: no quotes — {{{quantity}}}
    queryType:
      type: array
      items:
        type: string
        enum:
          - bulk_insert
          - per_record
          - per_page
          - bulk_load
      x-enumDescriptions:
        bulk_insert: Batch INSERT via multi-row VALUES clause for efficient bulk data loading.
        per_record: Execute one SQL statement per record, giving full control over individual record SQL.
        per_page: Execute one SQL statement per page (batch) of records.
        bulk_load: Stage data as a file and load via database-native COPY/bulk mechanism for maximum throughput.
      x-celigo-ui-override: >-
        Required by the JDBC import form (jdbc.queryType is required:true). Encoded to mirror the
        form so builders produce connectable configurations.
      description: |
        Execution strategy for the SQL operation. REQUIRED. Must be an array with one value.

        **Decision tree**

        1. If UPDATE or UPSERT/MERGE → ["per_record"] (set query field)
        2. If INSERT with "ignore existing" / "skip duplicates" / match logic → ["per_record"] (set query field)
        3. If pure INSERT with no duplicate checking → ["bulk_insert"] (set bulkInsert object)
        4. If high-volume bulk load → ["bulk_load"] (set bulkLoad object)

        **Critical relationship to other fields**
        | queryType        | REQUIRES              | DO NOT SET   |
        |------------------|-----------------------|--------------|
        | ["per_record"]   | query (array)         | bulkInsert   |
        | ["per_page"]     | query (array)         | bulkInsert   |
        | ["bulk_insert"]  | bulkInsert object     | query        |
        | ["bulk_load"]    | bulkLoad object; query too when bulkLoad.overrideMergeOrInsertQuery is true | query otherwise |

        **Examples**
        - Per-record upsert: ["per_record"]
        - Bulk insert: ["bulk_insert"]
        - Bulk load: ["bulk_load"]
    bulkInsert:
      type: object
      description: |
        Bulk insert configuration. REQUIRED when queryType is ["bulk_insert"]. DO NOT SET when queryType is ["per_record"].

        Enables efficient batch insertion of records into a database table without per-record SQL.
      properties:
        tableName:
          type: string
          description: |-
            The table Batch Insert writes to, resolved by the driver at run time; set when
            `queryType` is `["bulk_insert"]`. On a Databricks connection this must be the bare
            table name — Batch Insert resolves it only within the catalog and schema the
            connection defaults to (its `ConnCatalog` / `ConnSchema` connection properties): a
            `catalog.schema.table` name fails every record with
            `MAPPING_INVALID_TABLE_OR_COLUMN_NAME` ("The table name or one of the column names
            in the mapping is invalid") even when the table, its columns and the grants all
            exist, and a `schema.table` name does not write either. Oracle Thin accepts
            `schema.table`; the `per_record` query type takes a fully qualified name in its
            SQL instead.
          x-celigo-ai-guidance:
            - |-
              `MAPPING_INVALID_TABLE_OR_COLUMN_NAME` on a Databricks Batch Insert whose
              tableName is `catalog.schema.table` is the qualification, not a misspelling.
              Verify the table and the mapped columns through the import's connection
              (DESCRIBE); when they resolve, the fix is the bare table name plus
              `ConnCatalog` / `ConnSchema` on the connection (a second connection when another
              import on it needs a different catalog or schema), or the `per_record` query
              type with the qualified name in the SQL — never renaming verified columns,
              another permission check, or a Support ticket.
          examples: ["netsuite_customer_directory", "dbo.Customers"]
        batchSize:
          type: string
          description: |
            Number of records per batch during bulk insert.
            Larger values improve throughput but use more memory.
            Common values: "1000", "5000".
          examples: ["1000", "5000"]
    bulkLoad:
      type: object
      description: |
        Bulk load configuration. REQUIRED when queryType is ["bulk_load"]. Uses database-native bulk loading for maximum throughput.
      properties:
        tableName:
          type: string
          description: |
            Target database table name for bulk load. REQUIRED.
            Can include schema qualifiers (e.g., "schema.tableName").
          examples: ["public.orders", "ANALYTICS.STG_ORDERS"]
        primaryKeys:
          type: [array, 'null']
          items:
            type: string
          description: |
            Primary key column names for upsert/merge during bulk load.
            When set, existing rows matching these keys are updated; non-matching rows are inserted.
            Example: ["id"] or ["order_id", "product_id"] for composite keys.
        overrideMergeOrInsertQuery:
          type: boolean
          description: |-
            When true, the statement in `query` replaces the auto-generated MERGE / INSERT for the
            bulk load, enabling ignore-existing logic or conditional updates. Saving it true with no
            `query` entry fails with 422 `missing_required_field` ("jdbc bulk_load imports require a
            query."), on create and on update.
        aggregation:
          type: object
          description: |-
            How the staged files are cut and handed to the database. The server fills `type` and
            `maxFileSizeInMB` when they are omitted, so `loadDataAsAvailable` is the only value to
            author. A `type` other than `size`, or a `loadDataAsAvailable` that is not a boolean,
            drops the whole block on save without an error.
          properties:
            type:
              type: string
              enum: [size]
              x-enumDescriptions:
                size: Files are cut by size
              description: Filled by the server on save; the only mode is size-based cutting.
            maxFileSizeInMB:
              type: integer
              description: Size of each staged file in MB; the server fills 250 when the field is omitted, so leave it out.
              examples: [250]
            loadDataAsAvailable:
              type: boolean
              description: |-
                When true, each staged file is sent for loading as soon as it is written, so the
                dataset arrives as several smaller loads. When false, every file is held until all
                are ready and they are loaded together.
    lookups:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            description: |-
              Unique identifier for this lookup. Mapping fields reference it
              via `lookupName` and Handlebars expressions reference it via
              `{{lookup "name" value}}`. Must be unique within this
              resource's `lookups` array.
            examples: ["lookupUserByEmail"]
          query:
            type: string
            x-celigo-agent:
              - sql
              - handlebars
            description: SQL query for the lookup (e.g., "SELECT id FROM users WHERE email = '{{{email}}}'").
            x-celigo-ai-guidance:
              - |-
                SQL `SELECT` statement that resolves the lookup value.
                Inject values from the incoming record with Handlebars — JDBC queries use triple braces:
                `SELECT id FROM users WHERE email = '{{{email}}}'`.
                Returns a single row;
                use `extract` to pick a column when multiple are selected.
            examples: ["SELECT id FROM users WHERE email = '{{{email}}}'"]
          extract:
            type: string
            description: |-
              JSONPath-style expression that selects the value from the
              query result row (e.g. `id`, `details.price`). Omit when
              the query returns a single scalar.
            examples: ["id"]
          _lookupCacheId:
            type: string
            format: objectId
            x-celigo-refModel: lookupCaches
            description: |-
              Optional reference to a LookupCache resource. When set, the
              lookup reads from the cache instead of issuing a live SQL
              query — useful for stable reference data that should be
              pre-loaded.
          allowFailures:
            type: boolean
            description: |-
              When true, a lookup miss (no matching row and no `default`)
              resolves to `null` and the import continues. When false
              (default), a miss halts the record.
          map:
            type: object
            description: |-
              Optional static key→value object evaluated BEFORE the SQL
              query. When the incoming value matches a key, the mapped
              value is returned without querying the database.
          default:
            type: string
            description: |-
              Value returned when the query matches no rows. When omitted
              and `allowFailures` is false, an unmatched lookup halts the
              record.
      description: |-
        Lookup definitions executed against the JDBC connection. Each entry
        runs a `SELECT` and extracts a value used by field mappings
        (referenced via `lookupName`) or Handlebars expressions
        (referenced via `{{lookup "name" value}}`).
      x-celigo-ai-guidance:
        - |-
          ## Mirror invariant
          The Celigo platform persists lookups in TWO locations on a JDBC
          import: top-level `lookups` and `jdbc.lookups`. Both arrays
          must hold byte-for-byte identical content, so write both on every
          save.
      x-celigo-agent:
        - lookup
  if:
    required: [queryType, bulkLoad]
    properties:
      queryType:
        type: array
        contains:
          const: bulk_load
      bulkLoad:
        required: [overrideMergeOrInsertQuery]
        properties:
          overrideMergeOrInsertQuery:
            const: true
  then:
    required: [query]
    properties:
      query:
        minItems: 1
