Request:
  type: object
  description: Fields that can be sent when creating or updating a connection.
  properties:
    name:
      type: string
      minLength: 1
      description: Display name for the connection.
      x-celigo-ai-guidance:
        - Name the connection after the ONE system it authenticates to — the application, plus the account, store, or environment when that distinguishes it (e.g. "Shopify - mystore", "NetSuite Non-Production").
        - Never name a connection after a flow or use case, and never include a second application in the name (not "Shopify to NetSuite Customer Sync"). Connections are account-level resources reused across many integrations; a use-case name hides which system the credentials belong to and misleads later reuse.
      examples: ["Salesforce Production", "NetSuite Non-Production", "PostgreSQL Orders DB"]
      maxLength: 100
    type:
      type: string
      description: Connection type, which determines the authentication and connectivity options available and which config object must be supplied.
      enum:
        - netsuite
        - salesforce
        - ftp
        - s3
        - wrapper
        - http
        - rdbms
        - mongodb
        - as2
        - filesystem
        - mcp
        - dynamodb
        - jdbc
        - van
        - rest
      x-enumDescriptions:
        netsuite: NetSuite ERP connection, authenticated with token-based authentication (TBA) or OAuth 2.0 (`netsuite.authType`).
        salesforce: Salesforce CRM connection with OAuth 2.0 authentication.
        ftp: FTP, SFTP, or FTPS file transfer connection.
        s3: Amazon S3 cloud storage connection, authenticated with an access key pair or an AWS IAM role (`s3.authType`).
        wrapper: Wrapper connection that delegates to another connection type.
        http: Generic HTTP/REST API connection with full configuration control.
        rdbms: Native relational-database connection — MySQL, PostgreSQL, MariaDB, Microsoft SQL Server, Azure Synapse, Oracle, Snowflake, Google BigQuery, Amazon Redshift (the database is `rdbms.type`).
        mongodb: MongoDB NoSQL database connection.
        as2: AS2 (Applicability Statement 2) EDI connection.
        filesystem: Local or network filesystem connection (requires an Agent).
        mcp: MCP (Model Context Protocol) server connection.
        dynamodb: Amazon DynamoDB NoSQL database connection.
        jdbc: JDBC connection for relational systems without a native `rdbms` type (Databricks, Db2, Workday, NetSuite JDBC) and for the driver-specific paths `jdbc.type` names — Oracle Thin, which is the connection of NetSuite Analytics Warehouse (NSAW) and Oracle Autonomous Database, and SQL Server with Active Directory; Redshift, BigQuery and Snowflake are `rdbms` types.
        van: Value-Added Network connection for EDI document exchange.
        rest: REST connection driven by a pre-built HTTP Connector template. Deprecated — use `http` instead.
    externalId:
      type: string
      description: |-
        External identifier for the connection, often used to correlate it with a record in a
        third-party system. On a connection inside an Integration App tile (`_connectorId` set)
        it is the app's own stamp on the connections its install created (`shopify_connection`,
        …), and the platform refuses the DELETE of a tile connection that carries it or
        `_sourceId`; a tile connection with neither was added by a user and deletes normally.
        The name lock on tile connections follows `_connectorId`, not this field.
      examples: ["erp-conn-001"]
    assistant:
      type: string
      description: |-
        Lowercase application name for HTTP connections to systems with an integrator.io
        adaptor (e.g. "shopify", "ebay"). Only applies to http connections. The platform
        checks the slug against its current adaptor list — an unknown value fails the save
        with 422 `enum` — and uses it to resolve the HTTP connector link on every save (see
        `http._httpConnectorId`), so send it only when the application really is a legacy
        adaptor: on an Azure Data Lake Storage Gen2 connection it drops the connector ids.
        `celigofilestorage` (Celigo File storage) is such a slug: the save links the connector
        `GET /v1/httpconnectors` lists with that `legacyId`, and the connection must carry
        `accessScope` (see below).
      examples: ["shopify"]
      x-celigo-ai-guidance:
        - |-
          Omit `assistant` on an Azure Data Lake Storage Gen2 connection. With
          `assistant: "azuredatalakestoragegen2"` (or any other slug) the save answers 201/200
          but stores no `http._httpConnectorId` or `http._httpConnectorVersionId`; the
          connection form never sends it. Send the ADLS connector id and version id without
          `assistant` — a PUT that drops `assistant` and re-sends them restores the link.
        - |-
          A value outside the platform's adaptor list fails with 422 `enum` on `assistant`
          ("`<value>` is not a valid enum value for path `assistant`."); for a connector-framework
          application with no legacy adaptor, link it through `http._httpConnectorId` instead.
    accessScope:
      type: object
      description: |-
        What a Celigo APIs connection (`assistant: integratorceligoapi`) or a Celigo File
        storage connection (`assistant: celigofilestorage`) may reach in the account: the
        account's custom APIs, listeners, standard integrator.io APIs and Celigo Storage
        folders. Neither connection can be created without it — the rule keys on the body
        `assistant`. The caller's role decides which scope a save may carry: the account
        owner and administrators save any `type`, and their update that omits `accessScope`
        leaves the stored scope unchanged; a user with Manage access saves `integration`
        only, for integrations they manage, and re-sends it on every PUT. A File
        storage connection's `custom` scope takes Celigo Storage folders only: a non-empty
        `_apiIds` or `_exportIds` on it fails with 422 `invalid_access_scope` ("<field> is not
        supported on access scopes for this connector."). The connection document never
        carries it — the stored scope is read from `GET /v1/accessScope/connections/{_id}`.
      required: [type]
      properties:
        type:
          type: string
          enum: [full, custom, integration]
          x-enumDescriptions:
            full: Every custom API, listener and standard integrator.io API in the account, and every Celigo Storage folder
            custom: Only the APIs, listeners and Celigo Storage folders listed in the sibling arrays
            integration: The standard integrator.io APIs for the resources of the integrations listed in `_integrationIds`, and those integrations' system folders in Celigo Storage
          description: |-
            How much of the account the connection may reach. Each type takes its own
            selections: `full` takes none, `custom` takes APIs, listeners and folder paths,
            `integration` takes integrations only.
        _apiIds:
          type: array
          items:
            type: string
            format: objectId
            x-celigo-refModel: apis
          description: Custom APIs the connection may invoke. Present when `type` is `custom`.
        _exportIds:
          type: array
          items:
            type: string
            format: objectId
            x-celigo-refModel: exports
          description: Listeners (webhook exports) the connection may trigger. Present when `type` is `custom`.
        _integrationIds:
          type: array
          items:
            type: string
            format: objectId
            x-celigo-refModel: integrations
          description: |-
            Integrations whose resources — the integration, its flows and their errors, its
            exports, imports and connections — the connection may reach through the standard
            integrator.io APIs, and whose system folders it may read and write in Celigo
            Storage. Present when `type` is `integration`.
        _fileStoragePaths:
          type: array
          items:
            type: string
          description: |-
            Celigo Storage folder paths the connection may read and write, matched as prefixes
            — each path also grants every folder beneath it, `/` alone grants every folder, and
            there are no wildcards. Present when `type` is `custom`; a `custom` connection with
            the field omitted or empty has no Celigo Storage access.
          examples: [["/Reports/", "/Inbound/EDI/"], ["/"]]
      # The server's cross-field rules (422 invalid_access_scope), nested else-if, stack-style.
      if: { properties: { type: { const: full } }, required: [type] }
      then:
        properties:
          _apiIds: { maxItems: 0 }
          _exportIds: { maxItems: 0 }
          _integrationIds: { maxItems: 0 }
          _fileStoragePaths: { maxItems: 0 }
      else:
        if: { properties: { type: { const: integration } }, required: [type] }
        then:
          required: [_integrationIds]
          properties:
            _integrationIds: { minItems: 1 }
            _apiIds: { maxItems: 0 }
            _exportIds: { maxItems: 0 }
            _fileStoragePaths: { maxItems: 0 }
        else:
          properties:
            _integrationIds: { maxItems: 0 }
      x-celigo-ai-guidance:
        - |-
          A Celigo APIs connection POST without `accessScope` fails with 422 `missing_required_field`
          ("Scope is required for this connection. Please select Full access or Custom."). As the
          account owner and as an administrator, a PUT without it answered 200 on a connection of
          each stored scope, on both connectors, and the stored scope read back unchanged. A
          `type` outside the enum fails with 422 `enum`.
        - |-
          The caller's role limits the `type` a save may carry, on both connectors. As the account
          owner and as an administrator, POST of a Celigo APIs connection and of a Celigo File
          storage connection with `full`, with `custom` and with `integration` answered 201. As a
          user with Manage access — account-wide, on one integration, or Monitor account-wide
          with Manage on one integration — POST with `type: integration` listing an integration
          the user manages answered 201, and POST with `full` answered 403 `access_restricted`
          ("You don't have the right to perform this action. Please contact your account
          administrator to receive manage permission for this account."); with account-wide
          Manage, POST with `custom` or with no `accessScope` answered the same 403. `integration`
          listing an integration the user does not manage answered 403 `invalid_access`. For
          such a caller send `integration` with the integrations the connection is for; a `full`
          or `custom` connection is the account owner's or an administrator's to create.
        - |-
          For a user with Manage access, a PUT of a connection whose stored scope is `full` or
          `custom` answered that 403 whether the body left `accessScope` out or carried
          `integration`, and a PUT of an `integration` connection answered 200 only when the
          body carried `accessScope` with `type: integration` — without it, or with `full` or
          `custom`, the same 403. Read the stored scope and re-send it on every PUT. `PATCH` of
          `/name` answered 204 on a connection of each scope and `PATCH` of
          `/http/concurrencyLevel` on a `full` and an `integration` connection; DELETE answered
          204 on an `integration` connection and the same 403 on a `full` or `custom` one. As an
          administrator, DELETE of a `full` and of a `custom` connection answered 204.
        - |-
          That 403 sentence asks for manage permission whatever the caller holds: a caller who
          already has Manage access received it on each refused request above. A user with
          Monitor access and no Manage grant was refused each create — of an ordinary connection
          and of a Celigo APIs connection — with 403 `access_restricted` and another sentence
          ("The role which you are associated with doesn't have the required permissions to
          perform the action.").
        - |-
          Each mismatch between `type` and the selections fails with 422 `invalid_access_scope` and
          names the field: `full` with any of `_apiIds`, `_exportIds`, `_integrationIds` or
          `_fileStoragePaths`; `custom` with `_integrationIds` ("Use \"integration\" access type");
          `integration` with no `_integrationIds`, or with `_apiIds`, `_exportIds` or
          `_fileStoragePaths`. An id that is not an existing API or integration fails with 422
          `invalid_ref`.
        - |-
          Choose the narrowest `type` the connection's use needs: a flow that reads or writes Celigo
          Storage files → `custom` with the folder paths it uses (`/Reports/` grants that folder and
          everything beneath it), or `integration` when the files live in that integration's
          system folder; specific custom APIs or listeners → `custom` with their ids; a
          flow that reads one integration's resources through the standard integrator.io REST APIs
          (its flows, a flow's errors) → `integration` with that integration; the standard APIs
          across the account → `full`. A `custom` connection with `_fileStoragePaths` omitted or
          empty has no storage access — its storage step fails at run time with 401.
        - |-
          Through an `integration` connection of either connector, `GET /v1/storage/items?type=folder`
          at the account root listed only the listed integration's system folder. Listing inside
          that folder answered 200, `POST /v1/storage/items` with it as `_parentId` answered 201,
          and `POST /v1/storage/files/initiateUpload` into it answered 200. The same list and
          create against another integration's system folder and against a folder at the account
          root, a create at the account root itself, and an upload into a folder at the root
          each answered 403 `STORAGE_INTEGRATION_ACCESS_DENIED` ("You do not have access to this
          folder").
        - |-
          Through a `custom` connection listing one listener, `POST /v1/exports/{_id}/data` to
          that listener answered 204, while `GET /v1/exports/{_id}` for the same listener,
          `GET /v1/connections`, `GET /v1/integrations/{_id}`, `GET /v1/flows`,
          `GET /v1/flows/{_id}/errors`, `GET /v1/imports` and `GET /v1/jobs` were each refused
          with 401 `access_restricted` ("You don't have the required permissions to perform the
          action."). Through an `integration` connection the same reads answered 200
          (`GET /v1/jobs` asks for the integration `_id`: 400 `query_param_required`), and
          `GET /v1/integrations/{_id}` for another integration answered 403 `invalid_access`.
        - |-
          An id in `_exportIds` that is not a listener is accepted and dropped: the stored scope
          comes back without it.
        - |-
          The connection document never carries `accessScope`; read the stored scope from
          `GET /v1/accessScope/connections/{_id}` (`scope`, `apis`, `exports`, `integrations`,
          `fileStoragePaths`) rather than inferring it from the document.
        - |-
          A Celigo File storage connection (`type: http`, `assistant: celigofilestorage`) POST
          without `accessScope` fails with 422 `missing_required_field` ("Scope is required for
          this connection. Please select Full access or Custom."): send `{type: full}`,
          `{type: custom, _fileStoragePaths: [...]}` or `{type: integration, _integrationIds: [...]}`.
          A non-empty `_apiIds` or `_exportIds` on
          it fails, on POST and PUT, with 422 `invalid_access_scope` ("_apiIds is not supported
          on access scopes for this connector."). The save fills `http._httpConnectorId` and
          `http._httpConnectorVersionId` from the connector whose `legacyId` is
          `celigofilestorage` in `GET /v1/httpconnectors` — look the id up there rather than
          hardcoding one.
    _agentId:
      type: string
      format: objectId
      x-celigo-refModel: agents
      description: |-
        Reference to a Celigo on-premise Agent. Types that run on an agent (filesystem, jdbc
        agent/activedirectory, Oracle rdbms, and on-premise mongodb) need one binding — this
        agent, or an agent group through `_agentGroupId`; either satisfies the requirement
        (live-verified for filesystem, jdbc `agent` and `activedirectory`, and Oracle: with
        neither id the POST answers 422 `agent_mode_only`; with `_agentGroupId` alone it does not).
        The agent establishes a secure tunnel between the on-premise environment and
        integrator.io. The connection form writes one of the two ids and omits the other; a
        connection never carries both. Microsoft Fabric Warehouse connections (`rdbms.type`
        `fabric`) are cloud-only: a create or update that sets `_agentId` fails with 422
        `invalid_field_value` on `_agentId`.
      examples: ["5f8d43a1b9e5a80011a35f2c"]
    _agentGroupId:
      type: string
      format: objectId
      x-celigo-refModel: agentgroups
      description: |-
        On-premise agent group that serves this connection instead of a single
        `_agentId`; a connection binds one or the other, never both — the connection
        form writes one id and omits the other. Requests go to the first healthy
        member in the group's priority order (source-only: the dispatch rule the
        platform implements), so one host failing does not stop the flow. On an
        account whose license does not include agent groups, sending it fails with
        422 `agent_groups_subscription_required` — "Your license does not support
        the agent groups feature." (live-verified); an id that names no group adds
        422 `invalid_ref` on `_agentGroupId` to the same response.
      examples: ["6650a1b2c3d4e5f60718293a"]
    _borrowConcurrencyFromConnectionId:
      type: string
      format: objectId
      x-celigo-refModel: connections
      description: |-
        Reference to another connection to share concurrency limits with. When set, this
        connection's traffic counts against the referenced connection's limit instead of its own,
        and its own concurrency and auto-recovery settings have no effect. One level only: the
        referenced connection may not itself borrow, and a connection that others borrow from
        cannot start borrowing. Pointing it at the connection itself fails with 422
        `connection_borrows_from_another`, and an id that matches no connection with 422 `invalid_ref`.
      examples: ["615dfa0742763671275b70ab"]
      x-celigo-ai-guidance:
        - |-
          Set this when several connections target one external account whose API enforces a
          single account-wide concurrency limit (for example one NetSuite account): put the limit
          on one parent connection and point the others here, so their combined traffic can never
          exceed it.
        - |-
          A borrower drains through the parent's queue as well as its ceiling, so a high-volume
          borrower competes with the parent's own flows — settle the priority split before
          choosing who borrows from whom.
    autoRecoverRateLimitErrors:
      type: boolean
      default: true
      description: |-
        When true, rate-limit errors from the target system trigger automatic recovery — concurrency
        drops to 1 and climbs back toward the adaptor block's `targetConcurrencyLevel`, which is the
        throughput lever while this is on. Turning it on copies the current `concurrencyLevel` into
        the target; turning it off unsets the target and leaves `concurrencyLevel` at its current value.
        A create gets `true` unless it sends `false`; while it is true, set a new connection's level
        with `targetConcurrencyLevel`. On `http`, `ftp`, `rdbms` and `mongodb` connections the create
        stores the target sent, or the adaptor's default without one, as both `concurrencyLevel` and
        `targetConcurrencyLevel`, whatever `concurrencyLevel` the body carried: 1 for `ftp`, 5 for
        `rdbms` and `mongodb`, and 25 for `http` where the license's `concurrency` is at least 25, so
        such an `http` create that sends only `concurrencyLevel: 10` is stored at 25. To keep the
        `concurrencyLevel` you send, create with this `false`.
        Recovery never runs on `ftp` connections: FTP errors aren't treated as rate limits.
        A rate limit hit by a Tool invocation (`POST /v1/tools/{_id}/invoke`) or an export preview
        (`POST /v1/exports/preview`) leaves the connection's concurrency as it is.
    __integrationIds:
      type: array
      maxItems: 100
      items:
        type: string
        format: objectId
        x-celigo-refModel: integrations
      description: |-
        Integrations to register the new connection on immediately after creation, making it
        available for use within them. Only honored on `POST /v1/connections` (ignored on PUT)
        and never persisted on the connection document. Ids are validated before the connection
        is saved; registration runs after the save, and per-integration failures are reported in
        `__failedIntegrationRegistrations` on the 201 response without rolling back the new
        connection.
      x-celigo-ai-guidance:
        - |-
          Invalid input rejects the whole request without creating the connection: a non-array value
          or duplicate ids fail with 422 invalid_request, an element that is not a valid ObjectId fails
          with 422 invalid_ref naming __integrationIds[i], an integration that does not exist in the
          account fails with 404, and more than 100 ids fails with 400 batch_size_exceeded.
        - |-
          Integrations installed through an Integration App cannot be registered this way — the
          connection is still created (201) and the failure is reported in
          __failedIntegrationRegistrations with code not_allowed.
      examples: [["6a55be91d16ee8270022893e"]]
    endUserProvidedFields:
      type: ['array', 'null']
      items:
        type: string
      description: |-
        Dot-paths of this connection's fields (for example `http.encrypted.apiKey` or
        `rdbms.user`) that each MCP end user must supply on their own `mcpChild` copy instead of
        inheriting the parent's value. Set it on the parent connection an MCP server collects
        end-user credentials for; omit it everywhere else. Omitting it (or sending `[]`) on
        `PUT` keeps the stored paths; send `null` to clear them. By the platform contract,
        changing the stored list — adding, removing, or clearing paths — invalidates the
        `mcpChild` connections end users already hold against this parent, so each of them
        sets up again through the MCP setup page before tools that use it run for them.
      x-celigo-ai-guidance:
        - |-
          List only the credential and tenant fields that differ per end user, never a path the
          account owns: `type`, `_agentId`, `_agentGroupId`, `wrapper._stackId`, or any `<adaptor>._iClientId`
          (e.g. `http._iClientId`) fails the save with 422
          `mcp_end_user_provided_field_not_allowed` (live-verified for `_agentGroupId`:
          "_agentGroupId is managed by the account owner and cannot be requested from an end user.").
        - |-
          This is the only MCP end-user field writable through `/v1/connections`; the child
          connections themselves are created by the end-user setup page, and `connectionRole:
          mcpChild` in a `POST` or `PUT` body fails with 422 `mcp_child_generic_route_not_allowed`.
      examples: [["http.encrypted.apiKey", "http.unencrypted.accountId"]]
    debugDate:
      type: string
      format: date-time
      description: Enables debug logging until this timestamp. Set to a future time to capture request/response logs.
      examples: ["2026-01-15T09:30:00.000Z"]
    settingsForm:
      type: object
      description: Dynamic form definition for connection-specific custom settings.
    settings:
      type: object
      description: |-
        Connection-specific settings captured by settingsForm. At runtime, steps using
        this connection read the values under the fixed scope key `connection` — e.g.
        `{{settings.connection.<fieldId>}}` in Handlebars or
        `$.settings.connection.<fieldId>` in Mapper 2.0 envelope references.
    pgp:
      description: Present for file-based connections (ftp, s3, filesystem, …) that encrypt or decrypt files with PGP.
      allOf:
        - $ref: './pgp.yml#/PGP'
    ssl:
      $ref: './ssl.yml#/SSL'
    # Connection type-specific config objects — supply the one matching `type`.
    netsuite:
      description: Present when `type` is `netsuite`.
      allOf:
        - $ref: './netsuite.yml#/NetSuite'
    salesforce:
      description: Present when `type` is `salesforce`.
      allOf:
        - $ref: './salesforce.yml#/Salesforce'
    ftp:
      description: Present when `type` is `ftp`.
      allOf:
        - $ref: './ftp.yml#/FTP'
    s3:
      description: Present when `type` is `s3`.
      allOf:
        - $ref: './s3.yml#/S3'
    http:
      description: Present when `type` is `http`.
      allOf:
        - $ref: './http.yml#/HTTP'
    rdbms:
      description: Present when `type` is `rdbms`.
      allOf:
        - $ref: './rdbms.yml#/RDBMS'
    mongodb:
      description: Present when `type` is `mongodb`.
      allOf:
        - $ref: './mongodb.yml#/MongoDB'
    as2:
      description: Present when `type` is `as2`.
      allOf:
        - $ref: './as2.yml#/AS2'
    filesystem:
      description: Present when `type` is `filesystem`.
      allOf:
        - $ref: './filesystem.yml#/Filesystem'
    dynamodb:
      description: Present when `type` is `dynamodb`.
      allOf:
        - $ref: './dynamodb.yml#/DynamoDB'
    jdbc:
      description: Present when `type` is `jdbc`.
      allOf:
        - $ref: './jdbc.yml#/JDBC'
    van:
      description: Present when `type` is `van`.
      allOf:
        - $ref: './van.yml#/VAN'
    mcp:
      description: Present when `type` is `mcp`.
      allOf:
        - $ref: './mcp.yml#/MCP'
    wrapper:
      description: Present when `type` is `wrapper`.
      allOf:
        - $ref: './wrapper.yml#/Wrapper'
    rest:
      deprecated: true
      description: Present when `type` is `rest`. Deprecated — superseded by `http` with a pre-built HTTP Connector template.
      allOf:
        - $ref: './rest.yml#/REST'
  required:
    - name
    - type
  # The config object matching `type` must be supplied. Nested if/else-if (no allOf), stack-style.
  # The netsuite branch also carries the per-authType form requireds (they live here, scoped to
  # type=netsuite, because jdbc connections embed a `netsuite` auth subdoc the form rules don't
  # apply to — live jdbc connections store token-auto without an account).
  if: { properties: { type: { const: netsuite } }, required: [type] }
  then:
    required: [netsuite]
    properties:
      netsuite:
        if:
          properties:
            authType:
              const: basic
          required: [authType]
        then:
          required: [email, password]
        else:
          if:
            properties:
              authType:
                const: token
            required: [authType]
          then:
            required: [account, environment, tokenId, tokenSecret]
          else:
            if:
              properties:
                authType:
                  const: token-auto
              required: [authType]
            then:
              required: [account]
            else:
              if:
                properties:
                  authType:
                    const: oauth
                required: [authType]
              then:
                required: [account]
  else:
    if: { properties: { type: { const: salesforce } }, required: [type] }
    then: { required: [salesforce] }
    else:
      if: { properties: { type: { const: ftp } }, required: [type] }
      then: { required: [ftp] }
      else:
        if: { properties: { type: { const: s3 } }, required: [type] }
        then: { required: [s3] }
        else:
          if: { properties: { type: { const: http } }, required: [type] }
          then: { required: [http] }
          else:
            if: { properties: { type: { const: rdbms } }, required: [type] }
            then:
              required: [rdbms]
              if: { properties: { rdbms: { properties: { type: { const: fabric } }, required: [type] } }, required: [rdbms] }
              then:
                not: { required: [_agentId] }
            else:
              if: { properties: { type: { const: mongodb } }, required: [type] }
              then: { required: [mongodb] }
              else:
                if: { properties: { type: { const: as2 } }, required: [type] }
                then: { required: [as2] }
                else:
                  # filesystem runs on a Celigo Agent: the API requires a binding (422 "The file
                  # system connection requires Agent") — a single agent (_agentId) or an agent
                  # group (_agentGroupId); the connection form writes one and omits the other.
                  if: { properties: { type: { const: filesystem } }, required: [type] }
                  then:
                    required: [filesystem]
                    anyOf: [{ required: [_agentId] }, { required: [_agentGroupId] }]
                  else:
                    if: { properties: { type: { const: mcp } }, required: [type] }
                    then: { required: [mcp] }
                    else:
                      if: { properties: { type: { const: dynamodb } }, required: [type] }
                      then: { required: [dynamodb] }
                      else:
                        if: { properties: { type: { const: jdbc } }, required: [type] }
                        then:
                          required: [jdbc]
                          # A binding is API-enforced for the agent + activedirectory jdbc types (POST
                          # 422 agent_mode_only): a single agent (_agentId) or an agent group
                          # (_agentGroupId). Request-only (cross-level), matching filesystem.
                          if:
                            properties: { jdbc: { properties: { type: { enum: [agent, activedirectory] } }, required: [type] } }
                            required: [jdbc]
                          then:
                            anyOf: [{ required: [_agentId] }, { required: [_agentGroupId] }]
                        else:
                          if: { properties: { type: { const: van } }, required: [type] }
                          then: { required: [van] }
                          else:
                            if: { properties: { type: { const: wrapper } }, required: [type] }
                            then:
                              # _stackId required on create only (form-mirror) — the API accepts a
                              # wrapper without it (POST 201). Not in the shared/response
                              # schema because connector-managed wrappers (with _connectorId) omit it.
                              required: [wrapper]
                              properties:
                                wrapper:
                                  required: [_stackId]
                            else:
                              if: { properties: { type: { const: rest } }, required: [type] }
                              then: { required: [rest] }
