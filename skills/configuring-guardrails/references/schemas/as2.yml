As2:
  type: object
  description: |-
    Configures how outbound AS2 messages are built for this import. Required when the
    _connectionId field references an AS2 connection. AS2 (Applicability Statement 2) transmits
    EDI and other data securely over HTTP/S using S/MIME encryption and digital signatures; this
    object names the payload file, the message identifier, retry behavior, and any extra headers.
  required:
    - fileNameTemplate
  properties:
    _tpConnectorId:
      type: string
      format: objectId
      x-celigo-refModel: tradingpartnerconnectors
      description: |-
        Trading Partner Connector that supplies the partner-specific EDI and AS2 configuration.
        When set, the import inherits the connector's pre-configured settings; omit to use only
        the AS2 connection details.
      examples: ["60a2c4e6f321d800129a1a3c"]
    fileNameTemplate:
      type: string
      x-celigo-agent:
        - handlebars
      x-celigo-ui-override: >-
        Required by the AS2 import form (fieldDefinitions/resources/imports/as2.js:
        as2.fileNameTemplate is required:true, default 'file-{{timestamp}}'). Encoded to mirror
        the form so builders produce connectable configurations.
      description: |-
        Handlebars template that names the file carrying each AS2 message payload. The rendered
        name travels in the message's `Subject` header, as `File <name> sent from <as2Id> to
        <partnerId>`, and is not written on the payload's MIME part. Include a uniqueness token
        such as {{timestamp}} so concurrent or repeated sends do not collide; defaults to
        file-{{timestamp}} in the form.
      x-celigo-ai-guidance:
        - |-
          When a trading partner reports that the received document has no file name: this
          field's name is never written on the payload's MIME part, which is where a receiving
          server that takes the name from the payload's `Content-Disposition` header looks.
          Keep this field and, on an import that does not compress its files, add a
          `Content-Disposition` entry to `headers` that repeats its expression.
      examples: ["file-{{timestamp}}", "orders-{{timestamp}}.edi", "{{record.documentNumber}}.edi"]
    messageIdTemplate:
      type: string
      x-celigo-agent:
        - handlebars
      description: |-
        Handlebars template that generates the Message-ID header for each AS2 message. Placeholders
        are replaced at runtime; the resulting value must be globally unique and follow RFC 5322
        header formatting. Leave unset to let the platform generate the Message-ID.
      examples: ["{{timestamp}}-{{record.id}}@celigo.com", "<{{timestamp}}@example.com>"]
    maxRetries:
      type: number
      default: 0
      description: |-
        Number of times a failed transmission is retried after transient errors such as network
        failures or timeouts; does not affect the initial send. The form offers 1–5; set to 0
        (the default) to report failure immediately without retrying.
      examples: [0, 3, 5]
    headers:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            description: |-
              Name of the HTTP header, for example `Content-Disposition`. An entry named like a
              header integrator.io sets itself, such as `Subject`, replaces that header.
            x-celigo-ai-guidance:
              - |-
                Write `Content-Type`, `Content-Transfer-Encoding` and `Content-Disposition` in
                exactly this capitalization, whatever spelling the request uses.
          value:
            type: string
            description: Value sent for the header. Supports handlebars expressions rendered against the record.
            x-celigo-agent:
              - handlebars
      description: |-
        HTTP headers added to the request that carries the AS2 message: standard AS2 headers, or
        custom ones a trading partner agreement requires. `Content-Type`,
        `Content-Transfer-Encoding` and `Content-Disposition`, in exactly that capitalization, are
        written on the payload's MIME part before the message is signed and encrypted, unless the
        import compresses its files (`file.compressionFormat`): that part is then the compression
        wrapper, which carries `Content-Type: application/pkcs7-mime; smime-type=compressed-data;
        name="smime.p7z"`, `Content-Transfer-Encoding: base64` and `Content-Disposition:
        attachment; filename="smime.p7z"` whatever these entries say.
      x-celigo-ai-guidance:
        - |-
          To send the document's file name inside the signed and encrypted payload of an import
          that does not compress its files, add a `Content-Disposition` entry whose value is
          `attachment; filename="<the fileNameTemplate expression>"`. Without this entry the
          name is in the `Subject` header only.
      examples:
        - [{ "name": "Content-Disposition", "value": "attachment; filename=\"order-{{record.id}}.edi\"" }]
